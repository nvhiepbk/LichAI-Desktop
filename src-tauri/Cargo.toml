[package]
name = "lichai-desktop"
version = "0.4.1"
description = "LichAI Desktop tray app"
authors = ["LichAI"]
edition = "2021"

[lib]
name = "lichai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
tauri = { version = "2.8", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

chrono = { version = "0.4", features = ["clock"] }
