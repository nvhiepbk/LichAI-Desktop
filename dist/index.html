<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LịchAI Desktop</title>
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:transparent!important;color:#f5f7fb;overflow:hidden}
.shell{padding:8px;background:transparent;position:relative}
.card{
  position:relative;
  border:1px solid rgba(255,255,255,.16);
  border-radius:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 14% 9%,rgba(255,185,70,.17),transparent 31%),
    radial-gradient(circle at 86% 88%,rgba(69,99,255,.18),transparent 35%),
    linear-gradient(145deg,rgba(21,25,35,.97),rgba(9,13,22,.97) 68%);
  box-shadow:0 16px 38px rgba(0,0,0,.36);
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("lichai-logo.png") center 62%/48% auto no-repeat;
  opacity:.055;
  pointer-events:none;
  filter:saturate(.9);
}
.card > *{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 2px}
.brand{font-weight:800;letter-spacing:.3px;font-size:14px}
.close{border:0;background:transparent;color:#d9e1ef;font-size:20px;cursor:pointer;padding:2px 7px}
.content{padding:9px 17px 16px}
.weekday{font-size:18px;font-weight:800;color:#f5bd57}
.dateRow{display:flex;gap:14px;align-items:center;margin-top:1px}
.day{font-size:76px;line-height:.95;font-weight:900;letter-spacing:-4px}
.meta{font-size:17px;font-weight:700;line-height:1.5}
.lunar{font-size:16px;color:#e5e9f2;margin-top:7px}
.chi{font-size:12px;opacity:.72;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.box{padding:10px 11px;border-radius:13px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045)}
.box .k{font-size:11px;opacity:.68;margin-bottom:4px}
.box .v{font-size:12px;font-weight:700;line-height:1.35}
.event{margin-top:10px;padding:9px 11px;border-radius:12px;background:rgba(214,45,45,.18);border:1px solid rgba(255,119,119,.24);font-size:12px;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{border-radius:10px;border:1px solid rgba(255,255,255,.15);padding:9px 10px;background:#1c2330;color:#fff;cursor:pointer}
button.primary{background:#2563eb;border-color:#2563eb;font-weight:800}
.settings-title{font-size:20px;font-weight:850;margin-bottom:4px}
.settings-sub{font-size:12px;opacity:.66;margin-bottom:13px}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border-bottom:0}
input[type=checkbox]{width:18px;height:18px}
.foot{font-size:10px;opacity:.45;text-align:center;margin-top:11px}
.update-box{margin:10px 0;padding:11px;border-radius:12px;background:rgba(37,99,235,.14);border:1px solid rgba(96,165,250,.28);font-size:12px;line-height:1.5}
.update-box strong{display:block;font-size:14px;margin-bottom:4px}
.update-actions{display:flex;gap:8px;margin-top:9px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="shell">
  <section id="todayView" class="card">
    <div class="top"><div class="brand">🌙 LịchAI • Lịch ngày</div><button class="close" data-close>×</button></div>
    <div class="content">
      <div id="weekday" class="weekday">Hôm nay</div>
      <div class="dateRow">
        <div id="day" class="day">--</div>
        <div class="meta"><div id="solar">--/--/----</div><div id="lunar" class="lunar">Âm --/--</div></div>
      </div>
      <div id="chi" class="chi"></div>
      <div class="grid">
        <div class="box"><div class="k">🕒 Giờ hoàng đạo</div><div id="hours" class="v"></div></div>
        <div class="box"><div class="k">🧭 Hướng xuất hành tốt</div><div id="direction" class="v"></div></div>
      </div>
      <div id="event" class="event hidden"></div>
      <div class="actions"><button class="primary" id="openWeb">Mở LịchAI</button><button id="settingsFromToday">Cài đặt</button></div>
    </div>
  </section>

  <section id="settingsView" class="card hidden">
    <div class="top"><div class="brand">⚙️ LịchAI Desktop</div><button class="close" data-close>×</button></div>
    <div class="content">
      <div class="settings-title">Cài đặt</div>
      <div class="settings-sub">Tray nhẹ • Web là lõi chính</div>
      <div class="row"><label for="autostart">Khởi động cùng Windows</label><input id="autostart" type="checkbox"></div>
      <div class="row"><label for="notify">Hiện thông báo</label><input id="notify" type="checkbox" checked></div>
      <div class="row"><span>Phiên bản hiện tại</span><strong>0.5.1</strong></div>
      <button id="checkUpdateBtn">Kiểm tra cập nhật</button>
      <div id="updateResult" class="update-box hidden"></div>
      <button class="primary" id="openWeb2">Mở LịchAI</button>
      <button id="aboutBtn">About LịchAI</button>
      <button id="quitBtn">Thoát LịchAI Desktop</button>
      <div class="foot">Windows #03 • lich.ai.vn</div>
    </div>
  </section>
</div>

<script>
const invoke = window.__TAURI__.core.invoke;
const today = document.querySelector('#todayView');
const settings = document.querySelector('#settingsView');
const CURRENT_VERSION = '0.5.1';
const UPDATE_INTERVAL = 24 * 60 * 60 * 1000;

window.setLichAIMode = async (mode) => {
  if (mode === 'settings') {
    today.classList.add('hidden'); settings.classList.remove('hidden'); await loadSettings();
  } else {
    settings.classList.add('hidden'); today.classList.remove('hidden'); await loadToday();
  }
};

async function loadToday(){
  try{
    const x = await invoke('get_today_info');
    document.querySelector('#weekday').textContent=x.weekday;
    document.querySelector('#day').textContent=x.day;
    document.querySelector('#solar').textContent=x.solar;
    document.querySelector('#lunar').textContent=`${x.lunar} • ${x.lunar_year_can_chi}`;
    document.querySelector('#chi').textContent=`Ngày ${x.day_can_chi}`;
    document.querySelector('#hours').textContent=x.good_hours;
    document.querySelector('#direction').textContent=x.good_direction;
    const ev=document.querySelector('#event');
    if(x.event){ev.textContent=x.event; ev.classList.remove('hidden')} else ev.classList.add('hidden');
  }catch(e){console.error(e)}
}
async function loadSettings(){
  try{
    document.querySelector('#autostart').checked=await invoke('autostart_status');
    const s=await invoke('get_settings');
    document.querySelector('#notify').checked=s.notifications;
  }catch(e){console.error(e)}
}
window.checkLichAIUpdate = async function(manual=false){
  const last=Number(localStorage.getItem('lichai_update_checked_at')||0);
  if(!manual && Date.now()-last<UPDATE_INTERVAL) return;
  try{
    const data=await invoke('fetch_update_manifest');
    localStorage.setItem('lichai_update_checked_at',String(Date.now()));
    const latest=String(data.windows?.latest_version||'');
    const hasUpdate=compareVersions(latest,CURRENT_VERSION)>0;
    if(hasUpdate){
      await invoke('show_main_window');
      await window.setLichAIMode('settings');
      renderUpdate(true,latest,data.windows?.changes||[]);
    }else if(manual){
      renderUpdate(false,CURRENT_VERSION,[]);
    }
  }catch(e){
    if(manual) renderUpdate(null,'',[]);
  }
}
function compareVersions(a,b){
  const aa=a.split('.').map(Number),bb=b.split('.').map(Number);
  for(let i=0;i<Math.max(aa.length,bb.length);i++){
    const d=(aa[i]||0)-(bb[i]||0); if(d) return d;
  }
  return 0;
}
function renderUpdate(state,latest,changes){
  const box=document.querySelector('#updateResult');
  box.classList.remove('hidden');
  if(state===true){
    const items=changes.map(x=>`<li>${escapeHtml(String(x))}</li>`).join('');
    box.innerHTML=`<strong>Có phiên bản mới ${escapeHtml(latest)}</strong><div>Phiên bản hiện tại: ${CURRENT_VERSION}</div>${items?`<ul>${items}</ul>`:''}<div class="update-actions"><button class="primary" id="openDownload">Mở trang tải về</button><button id="dismissUpdate">Để sau</button></div>`;
    document.querySelector('#openDownload').onclick=()=>invoke('open_download_page');
    document.querySelector('#dismissUpdate').onclick=()=>box.classList.add('hidden');
  }else if(state===false){
    box.innerHTML='<strong>Bạn đang dùng phiên bản mới nhất</strong><div>Lịch AI Desktop '+CURRENT_VERSION+' hiện đã là phiên bản mới nhất.</div>';
  }else{
    box.innerHTML='<strong>Chưa thể kiểm tra cập nhật</strong><div>Vui lòng kiểm tra kết nối mạng và thử lại sau.</div>';
  }
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>invoke('hide_main_window'));
document.querySelector('#openWeb').onclick=()=>invoke('open_lichai');
document.querySelector('#openWeb2').onclick=()=>invoke('open_lichai');
document.querySelector('#settingsFromToday').onclick=()=>window.setLichAIMode('settings');
document.querySelector('#aboutBtn').onclick=()=>invoke('open_about_page');
document.querySelector('#quitBtn').onclick=()=>invoke('quit_app');
document.querySelector('#autostart').onchange=e=>invoke('set_autostart',{enabled:e.target.checked});
document.querySelector('#notify').onchange=e=>invoke('set_setting',{key:'notifications',value:e.target.checked});
document.querySelector('#checkUpdateBtn').onclick=()=>window.checkLichAIUpdate(true);
loadToday();
setTimeout(()=>window.checkLichAIUpdate(false),2500);
</script>
</body>
</html>
